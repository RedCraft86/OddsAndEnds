modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
#clientSideOnly=true # false by default

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="${mod_credits}"
description='''${mod_description}'''
displayURL="https://github.com/RedCraft86/${repo_name}"
issueTrackerURL="https://github.com/RedCraft86/${repo_name}/issues"
logoFile="${mod_id}_icon.png"
#updateJSONURL=""

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="lanternlib"
    mandatory=true
    versionRange="[${lanternlib_version}]"
    ordering="AFTER"
    side="BOTH"

[modproperties.${mod_id}] # NOTE, Catalogue uses logoFile above for banner, max height is 240
catalogueImageIcon="${mod_id}_icon.png"